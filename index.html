<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8efe6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tonni" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="A free daily Wordle from Tonni Games. Same rules, no paywall, no play limits."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Tonni Games</title>
    <script>
      (function () {
        try {
          var LIGHT = "classic";
          var DARK = "midnight";
          var KNOWN = {
            classic: true,
            midnight: true,
            "high-contrast": true,
            meadow: true,
          };
          var LEGACY = { system: "system", light: LIGHT, dark: DARK };
          var TOKENS = {
            classic: { bg: "#e8efe6", scheme: "light" },
            midnight: { bg: "#121a16", scheme: "dark" },
            "high-contrast": { bg: "#0a0a0a", scheme: "dark" },
            meadow: { bg: "#f3eee3", scheme: "light" },
          };
          var stored =
            localStorage.getItem("tonni-theme-v2") ||
            localStorage.getItem("tonni-theme-v1");
          var selection = "system";
          if (stored && KNOWN[stored]) selection = stored;
          else if (stored && LEGACY[stored]) selection = LEGACY[stored];
          var id =
            selection === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? DARK
                : LIGHT
              : selection;
          var info = TOKENS[id] || TOKENS[LIGHT];
          document.documentElement.setAttribute("data-theme", id);
          document.documentElement.setAttribute(
            "data-color-scheme",
            info.scheme,
          );
          document.documentElement.style.colorScheme = info.scheme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", info.bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
