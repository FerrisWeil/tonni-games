name: Restore pnpm-lock
on:
  workflow_dispatch:
  push:
    branches: [cursor/sign-in-master-e858]
    paths:
      - .github/workflows/restore-pnpm-lock.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/sign-in-master-e858
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download real lockfile
        run: |
          set -euo pipefail
          curl -fsSL -o pnpm-lock.yaml "https://gist.githubusercontent.com/FerrisWeil/0ba8914f49296984f190fcd3f75dec1b/raw/986d49377a614944fdaa31a77c4f85c04cb958f3/pnpm-lock.yaml"
          test "$(wc -c < pnpm-lock.yaml)" -eq 47635
          head -1 pnpm-lock.yaml | grep -q lockfileVersion
          grep -q '@supabase/supabase-js' pnpm-lock.yaml
          ! grep -q PLACEHOLDER pnpm-lock.yaml
          ! grep -q USE_FILE pnpm-lock.yaml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git status
          git commit -m "chore: pnpm-lock for @supabase/supabase-js" || exit 0
          git push
