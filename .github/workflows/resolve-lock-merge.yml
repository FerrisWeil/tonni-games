name: Resolve lockfile merge
on:
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/tonni-wordle-7045
          fetch-depth: 0
      - name: Merge main keeping feature lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit || true
          if [ -d lock-parts ]; then
            cat $(ls lock-parts/*.part | sort) > pnpm-lock.yaml
          fi
          test "$(wc -c < pnpm-lock.yaml)" -eq 45044
          test "$(md5sum pnpm-lock.yaml | awk '{print $1}')" = "a6b5669e78443987cd9e7155056d3c7f"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Merge main; keep full pnpm-lock.yaml (45044)"
          git push origin HEAD:cursor/tonni-wordle-7045
