name: Seed PWA b64 payloads

on:
  workflow_dispatch:
  push:
    branches: [cursor/pwa-home-screen-icons-67b9]
    paths:
      - ".github/workflows/seed-pwa-b64.yml"

permissions:
  contents: write

concurrency:
  group: seed-pwa-b64
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cursor/pwa-home-screen-icons-67b9
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base64 payloads from gist
        run: |
          set -euo pipefail
          mkdir -p public/icons
          curl -fsSL "https://gist.githubusercontent.com/FerrisWeil/d09482dee23fb597a79e93a8044d3114/raw/85e54173e252e8bcac544c5d7eff5c06ebc09952/public__apple-touch-icon.png.b64" -o "public/apple-touch-icon.png.b64"
          echo "fetched public/apple-touch-icon.png.b64 ($(wc -c < public/apple-touch-icon.png.b64) bytes)"
          curl -fsSL "https://gist.githubusercontent.com/FerrisWeil/d09482dee23fb597a79e93a8044d3114/raw/d6119eb1bde0a407994e0da460b0a817cc78fbb7/public__icons__icon-192.png.b64" -o "public/icons/icon-192.png.b64"
          echo "fetched public/icons/icon-192.png.b64 ($(wc -c < public/icons/icon-192.png.b64) bytes)"
          curl -fsSL "https://gist.githubusercontent.com/FerrisWeil/d09482dee23fb597a79e93a8044d3114/raw/a1d7090af365f1f9e34466403cee93caaae0763d/public__icons__icon-192-maskable.png.b64" -o "public/icons/icon-192-maskable.png.b64"
          echo "fetched public/icons/icon-192-maskable.png.b64 ($(wc -c < public/icons/icon-192-maskable.png.b64) bytes)"
          curl -fsSL "https://gist.githubusercontent.com/FerrisWeil/d09482dee23fb597a79e93a8044d3114/raw/0985e700d85f4a59b9fc8f02ac66ca7d9c7eb96d/public__icons__icon-512.png.b64" -o "public/icons/icon-512.png.b64"
          echo "fetched public/icons/icon-512.png.b64 ($(wc -c < public/icons/icon-512.png.b64) bytes)"
          curl -fsSL "https://gist.githubusercontent.com/FerrisWeil/d09482dee23fb597a79e93a8044d3114/raw/6af7f2291124977fae6939ddc19ee7710806223b/public__icons__icon-512-maskable.png.b64" -o "public/icons/icon-512-maskable.png.b64"
          echo "fetched public/icons/icon-512-maskable.png.b64 ($(wc -c < public/icons/icon-512-maskable.png.b64) bytes)"
          curl -fsSL "https://gist.githubusercontent.com/FerrisWeil/d09482dee23fb597a79e93a8044d3114/raw/395231c31143345a4677259a31cda22e65d746f1/public__icons__tonni-games-app-icon.png.b64" -o "public/icons/tonni-games-app-icon.png.b64"
          echo "fetched public/icons/tonni-games-app-icon.png.b64 ($(wc -c < public/icons/tonni-games-app-icon.png.b64) bytes)"

      - name: Commit each payload
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            public/apple-touch-icon.png.b64
            public/icons/icon-192.png.b64
            public/icons/icon-192-maskable.png.b64
            public/icons/icon-512.png.b64
            public/icons/icon-512-maskable.png.b64
            public/icons/tonni-games-app-icon.png.b64
          )
          for p in "${paths[@]}"; do
            git add "$p"
            if git diff --cached --quiet; then
              echo "No change for $p"
              continue
            fi
            git commit -m "Add base64 payload for $p"
          done
          # Remove this one-shot seed workflow
          rm -f .github/workflows/seed-pwa-b64.yml
          git add -A .github/workflows || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove seed-pwa-b64 workflow after seeding"
          fi
          git push origin HEAD:cursor/pwa-home-screen-icons-67b9
