name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Real merge gate (ADR 0019). Local parity with Vercel settings — no vercel CLI.
  # Vercel Git preview checks are NOT the gate: Hobby accounts hit build rate limits
  # and redact as a failing "Vercel" status. Preview deploys are disabled on the project.
  vercel-build:
    name: Verify Vercel build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate vercel.json
        run: |
          set -euo pipefail
          test -f vercel.json
          node <<'NODE'
          const fs = require("node:fs");
          const cfg = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
          const required = ["buildCommand", "outputDirectory", "framework", "installCommand"];
          for (const key of required) {
            if (!cfg[key] || typeof cfg[key] !== "string") {
              console.error(`vercel.json missing string field: ${key}`);
              process.exit(1);
            }
          }
          if (cfg.framework !== "vite") {
            console.error(`expected framework "vite", got ${cfg.framework}`);
            process.exit(1);
          }
          if (cfg.buildCommand !== "pnpm build") {
            console.error(`expected buildCommand "pnpm build", got ${cfg.buildCommand}`);
            process.exit(1);
          }
          if (cfg.outputDirectory !== "dist") {
            console.error(`expected outputDirectory "dist", got ${cfg.outputDirectory}`);
            process.exit(1);
          }
          if (!Array.isArray(cfg.rewrites) || cfg.rewrites.length === 0) {
            console.error("vercel.json must declare SPA rewrites that spare /api/*");
            process.exit(1);
          }
          const spa = cfg.rewrites.some(
            (r) =>
              typeof r.source === "string" &&
              r.source.includes("api") &&
              r.destination === "/index.html",
          );
          if (!spa) {
            console.error("vercel.json rewrites must SPA-fallback non-api routes to /index.html");
            process.exit(1);
          }
          console.log("vercel.json OK:", JSON.stringify(cfg, null, 2));
          NODE

      - name: Install (vercel.json installCommand, frozen)
        run: pnpm install --frozen-lockfile

      - name: Build (vercel.json buildCommand)
        run: pnpm build

      - name: Assert outputDirectory
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          echo "dist/ ready ($(du -sh dist | cut -f1))"

      - name: Verify Vercel serverless API routes
        run: |
          set -euo pipefail
          routes=(
            "api/wordle-nyt/[date].ts"
            "api/connections-nyt/[date].ts"
          )
          for f in "${routes[@]}"; do
            test -f "$f"
            grep -q "export default" "$f"
            echo "OK $f"
          done
          pnpm exec tsc --ignoreConfig --pretty false --strict --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck --noEmit \
            "api/wordle-nyt/[date].ts" \
            "api/connections-nyt/[date].ts"
          echo "API routes typecheck OK"

      - name: Gate note
        run: |
          cat <<'EOF'
          ::notice title=Verify Vercel build::This job is the merge gate (ADR 0019).
          Ignore a red GitHub "Vercel" status from the Vercel Git app when it links to
          upgradeToPro=build-rate-limit — Hobby preview builds are disabled; production
          promote uses the Deploy Hook below. Do not restore `vercel pull`/`vercel deploy`
          CLI here unless VERCEL_TOKEN is rotated to a token that can read project
          tonni-games (past tokens return User not found / Project Settings 404).
          EOF

  # Hook-only production promote. Broken VERCEL_TOKEN CLI path intentionally removed.
  deploy:
    name: Deploy production (hook)
    needs: [build, vercel-build]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          HOOK="${DEPLOY_HOOK_URL:-https://api.vercel.com/v1/integrations/deploy/prj_xpylCQ0S9SSuj8DYmOsctzSp3emH/080bdhUrpY}"
          echo "Triggering Vercel Deploy Hook for production (main)…"
          http_code=$(curl -sS -o /tmp/hook-resp.json -w "%{http_code}" -X POST "$HOOK" || true)
          echo "HTTP $http_code"
          cat /tmp/hook-resp.json || true
          echo
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "::error::Deploy Hook failed (HTTP $http_code). Check VERCEL_DEPLOY_HOOK_URL, or Hobby api-deployments-free-per-day rate limit."
            exit 1
          fi
          if ! grep -q '"job"' /tmp/hook-resp.json; then
            echo "::error::Deploy Hook response missing job payload. Rotate the hook in Vercel → Project → Settings → Git → Deploy Hooks."
            exit 1
          fi
          state=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/hook-resp.json","utf8")).job?.state || ""')
          id=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/hook-resp.json","utf8")).job?.id || ""')
          echo "Deploy Hook accepted job id=$id state=$state"
          if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
            echo "::error::Deploy Hook job state is $state. Likely Hobby build rate limit — wait for reset or upgrade. Production promote did not start."
            exit 1
          fi
          echo "::notice::Hook queued production build ($id). Watch https://vercel.com/ferrisweils-projects/tonni-games"
