name: Assemble lockfile
on:
  workflow_dispatch:
  push:
    paths:
      - 'lock-parts/**'
      - '.github/workflows/assemble-lock.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble pnpm-lock.yaml from parts
        run: |
          set -euo pipefail
          cat $(ls lock-parts/*.part | sort) > pnpm-lock.yaml
          wc -c pnpm-lock.yaml
          md5sum pnpm-lock.yaml
          test "$(wc -c < pnpm-lock.yaml)" -eq 45044
          test "$(md5sum pnpm-lock.yaml | awk '{print $1}')" = "a6b5669e78443987cd9e7155056d3c7f"
      - name: Commit assembled lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "Assemble full pnpm-lock.yaml from lock-parts"
          git push
