name: Assemble lockfile

on:
  workflow_dispatch:
  push:
    branches: [cursor/wordle-mobile-a11y-e341]
    paths:
      - '.github/lock-parts/**'
      - 'scripts/assemble-pnpm-lock.mjs'
      - '.github/workflows/assemble-lock.yml'

permissions:
  contents: write

concurrency:
  group: assemble-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble pnpm-lock.yaml from parts
        run: node scripts/assemble-pnpm-lock.mjs
      - name: Commit assembled lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already up to date ($(wc -c < pnpm-lock.yaml) bytes)"
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore(wordle): assemble full pnpm-lock.yaml ($(wc -c < pnpm-lock.yaml) bytes)"
          git push
