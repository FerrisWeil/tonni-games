name: Assemble pnpm-lock
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/sign-in-supabase-e858
      - name: Assemble lockfile from parts
        run: |
          set -euo pipefail
          : > pnpm-lock.yaml
          for f in $(ls lock-parts/*.part | sort); do
            cat "$f" >> pnpm-lock.yaml
          done
          wc -c pnpm-lock.yaml
          md5sum pnpm-lock.yaml
          test "$(wc -c < pnpm-lock.yaml)" -eq 47635
          test "$(md5sum pnpm-lock.yaml | awk '{print $1}')" = "8ca5451e5655ccb2c0a786e96d30c7bf"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock for @supabase/supabase-js"
          git push origin HEAD:cursor/sign-in-supabase-e858
